[package]
name = "kandown-desktop"
version = "0.49.0"
description = "Tauri 2.x desktop wrapper for kandown"
authors = ["Vanessa Depraute"]
edition = "2021"
rust-version = "1.77"

# 📖 Slice 2: native dialog (folder picker), and the system CLI plumbing
# (locate `kandown` on PATH, spawn its daemon, poll `.kandown/daemon.json`).
# The webview itself is still pointed at whatever the system CLI serves.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "8"
semver = { version = "1", features = ["serde"] }
url = "2"
ureq = { version = "2", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["clock"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# 📖 Quality gate for every change that targets main.
#
# Until this existed, nothing verified a change before it landed: publish.yml only
# fires on a v* tag, so a broken typecheck or build surfaced at release time, which
# is the most expensive moment to find it.
#
# The steps mirror `pnpm verify`, the local gate, so a green run here means the same
# thing it means on a laptop. Order is cheapest-signal-first: the generated-file
# checks take seconds and catch the most commonly forgotten step, then typecheck,
# then the suite, then the full build.
#
# The codemap step is what keeps the generated documentation honest: the pre-commit
# hook regenerates CODEMAP.md/.json locally, but hooks can be skipped (--no-verify,
# a fresh clone that never ran pnpm install, a web edit). `--check` re-renders the
# map and fails on any drift, so a stale index cannot reach main. It also fails when
# a source file has no @description header, which is what holds coverage at 100%.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# 📖 A new push to the same PR makes the in-flight run pointless: cancel it so the
# queue stays short and feedback stays fast. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # 📖 `cache: pnpm` keys the pnpm store on pnpm-lock.yaml, so an unchanged
      # lockfile restores the store instead of refetching every package.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Codemap is current and every file is documented
        run: pnpm codemap:check

      - name: Changelog index is current
        run: pnpm changelog:check

      - name: Extension agent brief is current
        run: pnpm extension-brief:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

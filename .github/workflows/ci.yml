# 📖 Quality gate for every change that targets main.
#
# Until this existed, nothing verified a change before it landed: publish.yml only
# fires on a v* tag, so a broken typecheck or build surfaced at release time, which
# is the most expensive moment to find it.
#
# The steps cover the same ground as `pnpm verify`, the local gate, so a green run
# here means the same thing it means on a laptop. Order is cheapest-signal-first,
# with one hard constraint: the generated-file checks and the typecheck run first
# because they cost seconds and catch the most commonly forgotten step, then the
# build, then the suite.
#
# `pnpm build` MUST stay ahead of `pnpm test`. The CLI tests spawn the real bundle
# in a tmpdir and `kandown init` copies `dist/index.html` into `.kandown/kandown.html`
# (src/cli/lib/init.ts). `dist/` is gitignored, so on a clean checkout, which is
# exactly what CI gets, that file only exists after a build: run the suite first and
# `cli-lifecycle.spec.ts` fails on a repository that is perfectly healthy.
#
# The codemap step is what keeps the generated documentation honest: the pre-commit
# hook regenerates CODEMAP.md/.json locally, but hooks can be skipped (--no-verify,
# a fresh clone that never ran pnpm install, a web edit). `--check` re-renders the
# map and fails on any drift, so a stale index cannot reach main. It also fails when
# a source file has no @description header, which is what holds coverage at 100%.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# 📖 Nothing in this job writes to the repository, so the token stays read-only.
permissions:
  contents: read

# 📖 A new push to the same PR makes the in-flight run pointless: cancel it so the
# queue stays short and feedback stays fast. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # 📖 `cache: pnpm` keys the pnpm store on pnpm-lock.yaml, so an unchanged
      # lockfile restores the store instead of refetching every package.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Codemap is current and every file is documented
        run: pnpm codemap:check

      - name: Changelog index is current
        run: pnpm changelog:check

      - name: Extension agent brief is current
        run: pnpm extension-brief:check

      - name: Typecheck
        run: pnpm typecheck

      # 📖 Ahead of the suite on purpose: the CLI tests need dist/index.html.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

name: Commit Log to Discord

on:
  push:
    branches: [main, master]

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Extract commit info
        id: info
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "sha_short=${GITHUB_SHA:0:7}"
            printf 'msg_first=%s\n' "$(printf '%s\n' "$HEAD_COMMIT_MESSAGE" | head -n1 | sed 's/"/\\"/g')"
            echo "repo=${{ github.event.repository.name }}"
            echo "ref=${GITHUB_REF#refs/heads/}"
          } >> "$GITHUB_OUTPUT"

      - name: Send embed to Discord
        env:
          DISCORD_WEBHOOK_GITHUB: ${{ secrets.DISCORD_WEBHOOK_GITHUB }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_GITHUB" ]; then
            echo "DISCORD_WEBHOOK_GITHUB is not configured; skipping Discord notification."
            exit 0
          fi

          JSON=$(cat <<EOF
          {
            "embeds": [{
              "title": "[${{ steps.info.outputs.repo }}] ${{ steps.info.outputs.msg_first }}",
              "url": "https://github.com/${{ github.repository }}/commit/${{ github.sha }}",
              "description": "Commit \`${{ steps.info.outputs.sha_short }}\` on \`${{ steps.info.outputs.ref }}\`",
              "color": 5814783,
              "footer": {
                "text": "${{ steps.info.outputs.repo }}"
              }
            }]
          }
          EOF
          )
          curl -fsS -H "Content-Type: application/json" \
            -d "$JSON" \
            "$DISCORD_WEBHOOK_GITHUB"
